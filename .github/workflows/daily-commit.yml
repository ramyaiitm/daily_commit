name: Daily Commit

on:
  schedule:
    - cron: '0 9 * * *'  # Runs daily at 09:00 UTC
  workflow_dispatch:      # Allows manual triggering

jobs:
  commit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Make a daily commit - 22f3002140@ds.study.iitm.ac.in
        run: |
          echo "Daily commit $(date)" >> daily_commit.txt
          git config --global user.name "GitHub Actions"
          git config --global user.email "22f3002140@ds.study.iitm.ac.in"
          git add daily_commit.txt
          git commit -m "Automated daily commit"
          git push
